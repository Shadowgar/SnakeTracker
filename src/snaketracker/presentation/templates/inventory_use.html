{% extends "base.html" %}
{% block title %}Use {{ item.name }} · Care Keeper{% endblock %}
{% block content %}
<section class="form-page focused-stock-form" aria-labelledby="page-title"><header><p class="page-kicker">{{ item.name }}</p><h1 id="page-title">Use inventory</h1><p class="lede">{{ item.available_display }} {{ item.on_hand_unit_display }} currently available.</p></header>
<form class="card form-stack" method="post" action="/inventory/{{ item.item_id }}/use"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ command_id }}"><input type="hidden" name="expected_stream_version" value="{{ item.stream_version }}"><label>Quantity used ({{ item.unit_symbol }})<input name="quantity" type="number" min="{{ '0.001' if item.allows_fractional else '1' }}" step="{{ '0.001' if item.allows_fractional else '1' }}" inputmode="{{ 'decimal' if item.allows_fractional else 'numeric' }}" required autofocus></label><label>Used for<select name="use_kind" required><option value="care">Care</option><option value="maintenance">Maintenance</option><option value="discarded">Discarded</option><option value="other">Other</option></select></label><label>Date<input name="occurred_at" type="datetime-local" value="{{ default_occurred_at }}" required></label><label>Note <span class="visually-hidden">(optional)</span><textarea name="note" maxlength="500"></textarea><small>Optional</small></label><div class="form-actions"><a href="/inventory/{{ item.item_id }}">Cancel</a><button type="submit">Record use</button></div></form></section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Add inventory · Care Keeper{% endblock %}
{% block content %}
<section class="form-page" aria-labelledby="page-title"><header><p class="eyebrow">Inventory</p><h1 id="page-title">Add inventory item</h1></header>
{% if errors.form %}<div class="alert" role="alert">{{ errors.form }}</div>{% endif %}
<form class="card form-stack" method="post" action="/inventory" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ command_id }}">
{% include "_inventory_catalog_fields.html" %}
<div class="form-actions"><a href="/inventory">Cancel</a><button type="submit">Add item</button></div></form></section>
{% endblock %}
{% block scripts %}<script defer src="/static/inventory-form.js?v=m65-a1"></script>{% endblock %}

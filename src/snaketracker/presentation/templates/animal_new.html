{% extends "base.html" %}
{% block title %}Add animal · SnakeTracker{% endblock %}
{% block content %}
<section class="form-page" aria-labelledby="page-title">
  <div>
    <p class="eyebrow">{{ principal.household_name }}</p>
    <h1 id="page-title">Add animal</h1>
    <p class="lede">Start the permanent care record with the identifying details you know today.</p>
  </div>
  <form class="card form-stack" method="post" action="/animals" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="idempotency_key" value="{{ command_id }}">
    {% if errors.form %}<div class="alert" role="alert">{{ errors.form }}</div>{% endif %}
    <label>Name<input name="name" value="{{ values.name|default('') }}" required autocomplete="off"></label>
    <label>Species<input name="species" value="{{ values.species|default('') }}" required></label>
    <label>Sex
      <select name="sex">
        <option value="">Not recorded</option>
        {% for option in ('female', 'male', 'unknown') %}
        <option value="{{ option }}" {% if values.sex|default('') == option %}selected{% endif %}>{{ option|capitalize }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Morph<input name="morph" value="{{ values.morph|default('') }}"></label>
    <label>Genetics<input name="genetics" value="{{ values.genetics|default('') }}"></label>
    <label>Birth or hatch date<input name="birth_hatch_date" type="date" value="{{ values.birth_hatch_date|default('') }}"></label>
    <label>Acquisition date<input name="acquisition_date" type="date" value="{{ values.acquisition_date|default('') }}"></label>
    <label>Breeder or source<input name="breeder_source" value="{{ values.breeder_source|default('') }}"></label>
    <label>Notes<textarea name="notes" rows="4">{{ values.notes|default('') }}</textarea></label>
    <div class="form-actions"><a href="/home">Cancel</a><button type="submit">Create animal</button></div>
  </form>
</section>
{% endblock %}

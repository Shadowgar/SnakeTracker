{% extends "base.html" %}
{% block title %}Forgot password | Care Keeper{% endblock %}
{% block content %}
<section class="auth-layout compact" aria-labelledby="page-title">
  <div class="intro-panel">
    <p class="eyebrow">Account recovery</p>
    <h1 id="page-title">Forgot password?</h1>
    <p>Enter your account email. We will send instructions when delivery is available.</p>
  </div>
  <form class="card form-stack" method="post" action="/forgot-password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email<input name="email" type="email" required autocomplete="email" autofocus></label>
    <button type="submit">Send reset instructions</button>
    <p><a href="/login">Return to Sign in</a></p>
  </form>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Record expense · SnakeTracker{% endblock %}
{% block content %}<section class="form-page" aria-labelledby="page-title"><header><p class="eyebrow">Expenses</p><h1 id="page-title">Record expense</h1></header>{% if errors.form %}<div class="alert" role="alert">{{ errors.form }}</div>{% endif %}<form class="card form-stack" method="post" action="/expenses"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ command_id }}"><label>Amount<input name="amount" inputmode="decimal" value="{{ values.get('amount','') }}" required></label><label>Currency<input name="currency" value="{{ values.get('currency','USD') }}" maxlength="3" required></label><label>Category<input name="category" value="{{ values.get('category','') }}" required></label><label>Payee<input name="payee" value="{{ values.get('payee','') }}"></label><label>Reference<input name="reference" value="{{ values.get('reference','') }}"></label><label>When ({{ principal.household_timezone }})<input name="occurred_at" type="datetime-local" value="{{ values.get('occurred_at','') }}" required></label><label>Notes<textarea name="notes">{{ values.get('notes','') }}</textarea></label><div class="form-actions"><a href="/expenses">Cancel</a><button type="submit">Record expense</button></div></form></section>{% endblock %}

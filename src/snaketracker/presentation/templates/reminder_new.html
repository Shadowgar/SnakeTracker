{% extends "base.html" %}
{% block title %}Add reminder · SnakeTracker{% endblock %}
{% block content %}<section class="form-page" aria-labelledby="page-title"><header><p class="eyebrow">Reminders</p><h1 id="page-title">Add care reminder</h1><p class="lede">Choose your own interval. SnakeTracker does not provide species advice in M5.</p></header>{% if errors.form %}<div class="alert" role="alert">{{ errors.form }}</div>{% endif %}<form class="card form-stack" method="post" action="/reminders"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ command_id }}"><label>Subject<select name="subject" required><optgroup label="Animals">{% for animal in animals %}<option value="animal:{{ animal.animal_id }}">{{ animal.name }}</option>{% endfor %}</optgroup><optgroup label="Enclosures">{% for enclosure in enclosures %}<option value="enclosure:{{ enclosure.enclosure_id }}">{{ enclosure.name }}</option>{% endfor %}</optgroup></select></label><label>Reminder type<select name="reminder_type"><option value="feeding">Feeding</option><option value="weight">Weight</option><option value="length">Length</option><option value="bath">Bath / soak</option><option value="cleaning">Enclosure cleaning</option><option value="water_change">Water change</option></select></label><label>Schedule<select name="schedule_kind"><option value="event_relative">After last effective care record</option><option value="fixed_interval">After a fixed anchor</option></select></label><label>Interval (days)<input name="interval_days" type="number" min="1" max="3650" required></label><label>Fixed anchor ({{ principal.household_timezone }})<input name="anchor_at" type="datetime-local"></label><label>Owner due-date override ({{ principal.household_timezone }})<input name="override_due_at" type="datetime-local"></label><input type="hidden" name="channel" value="local"><div class="form-actions"><a href="/reminders">Cancel</a><button type="submit">Add reminder</button></div></form></section>{% endblock %}

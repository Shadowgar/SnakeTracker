name: Container

on:
  push:
    branches: [main, "phase1/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build target architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build scan image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: snaketracker:ci
      - name: Qualify hardened taxonomy migrations in the actual runtime
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=128m,mode=1777 \
            --mount "type=bind,source=$PWD,target=/qualification,readonly" \
            --entrypoint python snaketracker:ci \
            /qualification/scripts/qualification/sqlite_taxonomy_upgrade.py
      - name: Scan image for fixed high-severity vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: snaketracker:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  arm64-release:
    name: ARM64 release qualification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      # PR qualification must describe the proposed source, not GitHub's merge commit.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Check isolated runner capacity
        run: |
          mkdir -p output/arm64-release
          python3 scripts/qualification/arm64_release.py preflight
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build deployable ARM64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: snaketracker:release-${{ env.SOURCE_SHA }}
          build-args: |
            SNAKETRACKER_UID=1001
            SNAKETRACKER_BUILD_GIT_SHA=${{ env.SOURCE_SHA }}
      - name: Verify actual installed source and migration runtime
        run: python3 scripts/qualification/arm64_release.py qualify
      - name: Scan actual ARM64 image with a fresh trusted database
        timeout-minutes: 20
        run: python3 scripts/qualification/arm64_release.py scan
      - name: Retain deployable image bytes
        run: |
          mkdir -p output/arm64-image
          docker image save "$(cat output/arm64-release/image.id)" \
            | gzip -1 > output/arm64-image/image.tar.gz
          python3 scripts/qualification/arm64_release.py archive
      - name: Upload qualified deployable image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-release-image-${{ env.SOURCE_SHA }}
          path: output/arm64-image
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Retain ARM64 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-release-evidence-${{ env.SOURCE_SHA }}
          path: output/arm64-release
          if-no-files-found: error
          retention-days: 90

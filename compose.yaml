name: snaketracker

x-app-common: &app-common
  image: snaketracker:${SNAKETRACKER_IMAGE_TAG:-phase2}
  build:
    context: .
    args:
      SNAKETRACKER_UID: ${SNAKETRACKER_UID:-1000}
  environment: &app-environment
    SNAKETRACKER_ENVIRONMENT: development
    SNAKETRACKER_DATABASE_PATH: /var/lib/snaketracker/snaketracker.sqlite3
    SNAKETRACKER_EXTERNAL_ORIGIN: http://localhost:8080
    SNAKETRACKER_SESSION_COOKIE_SECURE: "false"
    SNAKETRACKER_RUNTIME_SECRET_FILE: /run/secrets/runtime_secret
  secrets:
    - runtime_secret
  volumes:
    - ${SNAKETRACKER_DATA_DIR:-./runtime/data}:/var/lib/snaketracker
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: "no"

services:
  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

  web:
    <<: *app-common
    command: ["uvicorn", "snaketracker.bootstrap.application:application_factory", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"

  worker:
    <<: *app-common
    command: ["python", "-m", "snaketracker.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  nginx:
    image: nginx@sha256:5b4900b042ccfa8b0a73df622c3a60f2322faeb2be800cbee5aa7b44d241649e
    user: "101:101"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SNAKETRACKER_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

secrets:
  runtime_secret:
    file: ${SNAKETRACKER_RUNTIME_SECRET_FILE:-./secrets/runtime_secret}
